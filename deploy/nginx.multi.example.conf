# RecoTrust — Reverse-proxy multi-instances (même hôte)
# Prérequis : sticky session (WebSocket Streamlit) + RECOTRUST_DATA_DIR partagé
#
# Instances locales exemples :
#   127.0.0.1:8501  127.0.0.1:8502  127.0.0.1:8503

upstream recotrust_upstream {
    # Affinité par IP client (simple, efficace en interne)
    ip_hash;
    server 127.0.0.1:8501 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8502 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8503 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

# Variante cookie sticky (si module nginx-sticky-module / commercial) :
# upstream recotrust_upstream {
#     sticky name=recotrust_route path=/ expires=12h;
#     server 127.0.0.1:8501;
#     server 127.0.0.1:8502;
#     server 127.0.0.1:8503;
# }

server {
    listen 443 ssl http2;
    server_name recotrust.interne.paymetrust.net;

    # ssl_certificate     /etc/ssl/certs/recotrust.crt;
    # ssl_certificate_key /etc/ssl/private/recotrust.key;

    client_max_body_size 4096m;
    proxy_connect_timeout 60s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://recotrust_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        # Aide affinité si LB en amont
        proxy_set_header X-Forwarded-Prefix "";
    }

    # Santé simple (optionnel — chaque instance Streamlit répond sur /)
    # location /healthz { return 200 "ok\n"; }
}
