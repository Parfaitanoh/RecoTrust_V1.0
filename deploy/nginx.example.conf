# RecoTrust V5.1 — Exemple reverse-proxy nginx (HTTPS)
# Adapter server_name, certificats et upstream selon l'infrastructure.

upstream recotrust_upstream {
    server 127.0.0.1:8501;
    keepalive 8;
}

server {
    listen 443 ssl http2;
    server_name recotrust.interne.paymetrust.net;

    # ssl_certificate     /etc/ssl/certs/recotrust.crt;
    # ssl_certificate_key /etc/ssl/private/recotrust.key;

    # Limite body alignée sur maxUploadSize (4 Go)
    client_max_body_size 4096m;

    # Timeouts adaptés aux gros fichiers / traitements longs
    proxy_connect_timeout 60s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    # Headers sécurité de base
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://recotrust_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}

# Pour plusieurs instances Streamlit : voir nginx.multi.example.conf et SCALE_MULTI_INSTANCE.md
